<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087a57" />
    <meta name="robots" content="noindex" />
    <title>You're offline — Crave2Bite</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:#faf9f6;color:#26392d;font:15px/1.8 system-ui,sans-serif}
      main{width:min(440px,100%);padding:40px 28px;text-align:center;background:white;border:1px solid #eeece5;border-radius:12px}
      .mark{width:58px;height:58px;margin:0 auto 20px;display:block;border-radius:17px}
      h1{font-size:28px;line-height:1.2;letter-spacing:-.05em}
      p{color:#73776e;font-size:14px}
      a{display:inline-flex;margin-top:10px;padding:10px 18px;border-radius:6px;background:#087a57;color:white;text-decoration:none;font-weight:600}
      .note{font-size:12px}
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon.svg" alt="" aria-hidden="true" />
      <h1>The kitchen needs a connection.</h1>
      <p>Crave2Bite could not load. Check your internet connection, then try again.</p>
      <p class="note">No order has been placed. We'll only confirm your order when the canteen server responds.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
